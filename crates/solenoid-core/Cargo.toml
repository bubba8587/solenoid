[package]
name = "solenoid-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.99"

[lib]
crate-type = ["rlib"]

[features]
# `engine_invoke` answers only the commands the Obsidian plugin's popups send (`frame_backend::invoke_popup`).
plugin = []

[dependencies]
interim = { path = "../vendor/interim", default-features = false, features = ["jiff_0_2"] }
# interim reads on jiff in UTC; the bundled zone database serves IANA zones in every build (zone.rs).
jiff = { version = "0.2.38", default-features = false, features = ["tzdb-bundle-always"] }
libm = "0.2.16"
solenoid-schedule = { path = "../solenoid-schedule" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
ryu-js = "1"
csv = "1.4"
qrcodegen = "1.8"
md-5 = { version = "0.11.0", default-features = false }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
crc32fast = { version = "1.5.3", default-features = false }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
rustc-hash = "2.1.3"
fancy-regex = "0.20.0"
unicode-normalization = { version = "0.1.26", default-features = false }
unicode-general-category = { version = "1.1.0", default-features = false }
strsim = { version = "0.11.1", default-features = false }
uuid = { version = "1.29.0", default-features = false }

[dev-dependencies]
flate2 = "1"
rqrr = { version = "0.11", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fastrand = "2.5.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"

# For the native tests and benches: optimized, but built in parallel and incrementally, so an edit rebuilds in seconds
# (fat LTO relinked every test binary whole, minutes a change). The module that ships is built by solenoid-graph.
[profile.release]
opt-level = 2
lto = false
codegen-units = 16
incremental = true
panic = "abort"
strip = true

[[bench]]
name = "core"
harness = false

# The tests run in the dev profile, where overflow checks catch our own arithmetic; the crates we depend on (JSON,
# gzip, regex) are optimized, since every test spends most of its time decoding frozen fixtures through them.
[profile.dev.package."*"]
opt-level = 2
