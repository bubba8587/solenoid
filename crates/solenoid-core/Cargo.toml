[package]
name = "solenoid-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ryu-js = "1"
csv = "1.4"
qrcodegen = "1.8"
regress = { path = "../vendor/regress", default-features = false, features = ["std", "utf16", "no-property-escapes"] }

[dev-dependencies]
flate2 = "1"
rqrr = { version = "0.11", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
