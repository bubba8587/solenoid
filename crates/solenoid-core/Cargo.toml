[package]
name = "solenoid-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ryu-js = "1"
csv = "1.4"
qrcodegen = "1.8"
md-5 = { version = "0.11.0", default-features = false }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
crc32fast = { version = "1.5.3", default-features = false }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
rustc-hash = "2.1.3"
regress = { path = "../vendor/regress", default-features = false, features = ["std", "utf16", "no-property-escapes"] }

[dev-dependencies]
flate2 = "1"
rqrr = { version = "0.11", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
