# Float math the platform computes (Rust's f64 methods differ between wasm and native in the last bits, and from V8):
# the core answers bit for bit everywhere through `fdlibm.rs` (V8's Math) and `jsnum.rs` instead.
disallowed-methods = [
  { path = "f64::ln", reason = "use crate::fdlibm::log" },
  { path = "f64::log10", reason = "use crate::fdlibm::log10" },
  { path = "f64::log2", reason = "use crate::fdlibm::log2" },
  { path = "f64::log", reason = "use crate::fdlibm" },
  { path = "f64::ln_1p", reason = "use crate::fdlibm::log1p" },
  { path = "f64::exp", reason = "use crate::fdlibm::exp" },
  { path = "f64::exp2", reason = "use crate::fdlibm" },
  { path = "f64::exp_m1", reason = "use crate::fdlibm::expm1" },
  { path = "f64::powf", reason = "use crate::fdlibm::pow" },
  { path = "f64::powi", reason = "use crate::fdlibm::pow" },
  { path = "f64::sin", reason = "use crate::fdlibm::sin" },
  { path = "f64::cos", reason = "use crate::fdlibm::cos" },
  { path = "f64::tan", reason = "use crate::fdlibm::tan" },
  { path = "f64::asin", reason = "use crate::fdlibm::asin" },
  { path = "f64::acos", reason = "use crate::fdlibm::acos" },
  { path = "f64::atan", reason = "use crate::fdlibm::atan" },
  { path = "f64::atan2", reason = "use crate::fdlibm::atan2" },
  { path = "f64::sinh", reason = "use crate::fdlibm::sinh" },
  { path = "f64::cosh", reason = "use crate::fdlibm::cosh" },
  { path = "f64::tanh", reason = "use crate::fdlibm::tanh" },
  { path = "f64::asinh", reason = "use crate::fdlibm::asinh" },
  { path = "f64::acosh", reason = "use crate::fdlibm::acosh" },
  { path = "f64::atanh", reason = "use crate::fdlibm::atanh" },
  { path = "f64::cbrt", reason = "use crate::fdlibm::cbrt" },
  { path = "f64::hypot", reason = "use crate::excel_functions::math_hypot (V8's Math.hypot)" },
  { path = "f64::sin_cos", reason = "use crate::fdlibm::sin and cos" },
]
