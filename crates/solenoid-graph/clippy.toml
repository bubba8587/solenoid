# Float math the platform computes differs between wasm and native in the last bits: compute on the `libm` crate,
# which answers the same everywhere.
disallowed-methods = [
  { path = "f64::ln", reason = "use libm::log" },
  { path = "f64::log10", reason = "use libm::log10" },
  { path = "f64::log2", reason = "use libm::log2" },
  { path = "f64::log", reason = "use libm" },
  { path = "f64::ln_1p", reason = "use libm::log1p" },
  { path = "f64::exp", reason = "use libm::exp" },
  { path = "f64::exp2", reason = "use libm" },
  { path = "f64::exp_m1", reason = "use libm::expm1" },
  { path = "f64::powf", reason = "use libm::pow" },
  { path = "f64::powi", reason = "use libm::pow" },
  { path = "f64::sin", reason = "use libm::sin" },
  { path = "f64::cos", reason = "use libm::cos" },
  { path = "f64::tan", reason = "use libm::tan" },
  { path = "f64::asin", reason = "use libm::asin" },
  { path = "f64::acos", reason = "use libm::acos" },
  { path = "f64::atan", reason = "use libm::atan" },
  { path = "f64::atan2", reason = "use libm::atan2" },
  { path = "f64::sinh", reason = "use libm::sinh" },
  { path = "f64::cosh", reason = "use libm::cosh" },
  { path = "f64::tanh", reason = "use libm::tanh" },
  { path = "f64::asinh", reason = "use libm::asinh" },
  { path = "f64::acosh", reason = "use libm::acosh" },
  { path = "f64::atanh", reason = "use libm::atanh" },
  { path = "f64::cbrt", reason = "use libm::cbrt" },
  { path = "f64::hypot", reason = "use solenoid_core::excel_functions::hypot_all (n arguments)" },
  { path = "f64::sin_cos", reason = "use libm::sin and cos" },
]
