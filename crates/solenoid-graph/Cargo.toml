[package]
name = "solenoid-graph"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
solenoid-core = { path = "../solenoid-core" }
ruggine = { git = "https://github.com/bubba8587/ruggine", rev = "2aa2ca2fbab976d2d6f3f4b78863a091ebbd5482" }
ruggine-engine = { git = "https://github.com/bubba8587/ruggine", rev = "2aa2ca2fbab976d2d6f3f4b78863a091ebbd5482" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "=0.4.50"
js-sys = "=0.3.77"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
