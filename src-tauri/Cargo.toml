[package]
name = "solenoid"
version = "1.2.5"
description = "Solenoid — a local-first node graph for wiring live data into personal computation"
authors = ["Solenoid"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "solenoid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` makes webview.open_devtools() available in RELEASE builds too (it's
# always on in debug). The `open_devtools` command + the F12 / Ctrl+Shift+I hotkey
# rely on it so the console is reachable in a locally-compiled `tauri build`.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# Native HTTP so Web Source can fetch arbitrary URLs (no browser CORS wall).
tauri-plugin-http = "2"
# Custom window frame: a transparent overlay titlebar with native Snap support, so
# the frame is HTML/CSS we control (themed to the accent) instead of the OS caption.
tauri-plugin-decorum = "1"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: serde_json's DEFAULT float parse is lossy (fast path, can
# land one ulp off) — a JS cell crossing the IPC then differs from the value
# the oracle computed with, which the parity corpus catches as byte drift.
# The wire must round-trip doubles exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
# WS2 — the native relational engine. Lazy frames behind opaque handles; only a
# preview/column materializes. Lean feature set: lazy plans + string predicates +
# asof_join (the Join node's "as-of" `how`, nearest-match on a sorted key) + csv
# (the native CSV reader — desktop CSV import bypasses the JS Papa Parse +
# inference entirely, reading straight off disk into a DataFrame) + parquet
# (the native Parquet source, same file->engine principle). `dtype-date` +
# `dtype-datetime` ride along with parquet: a Parquet file's own Date/Datetime
# logical columns need those to read as such at all (without them Polars can't
# even represent a Date-typed column, `AnyValue::Date` doesn't exist in the
# build) — needed for "typed columns arrive intact, no inference step" to hold
# for date columns too, not just numeric/string ones. `product` (the group-by
# PRODUCT aggregate — gated off by default, panics at runtime without it:
# "activate 'product' feature").
polars = { version = "0.46", default-features = false, features = ["lazy", "strings", "asof_join", "semi_anti_join", "csv", "parquet", "dtype-date", "dtype-datetime", "product", "cum_agg", "rank", "rolling_window", "diff", "regex", "cross_join"] }
# `FunctionOptions`/`ApplyOptions`/`FunctionFlags` (the custom per-group-scalar
# GROUP-BY UDF for MODE, `engine.rs`'s `mode_expr`) aren't re-exported through
# `polars::prelude` — Cargo unifies this to the SAME 0.46.x already pulled in by
# `polars`/`polars-lazy`, so this doesn't add a second copy of the dependency.
polars-plan = { version = "0.46", default-features = false }

# Windows 11 DWM: set the window's border color (DWMWA_BORDER_COLOR) to the app
# accent so the focused-window frame matches the theme. Already in the dep tree via
# tauri; the Dwm + Foundation features expose the one call we need.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

# NOTE — stripping build paths from the shipped binary: Rust bakes source paths into
# panic locations, and for registry deps those look like
# `C:\Users\<username>\.cargo\registry\src\...`, leaking the build machine's username.
# `[profile.release] trim-paths` would be the clean fix but is NOT stable in this
# toolchain's Cargo, so release builds must pass a remap instead (the `release:desktop`
# npm script sets CARGO_ENCODED_RUSTFLAGS=--remap-path-prefix=$USERPROFILE=C:\build).
# Verify a cut with: `grep -a -c "$USERNAME" target/release/solenoid.exe` → must be 0.

