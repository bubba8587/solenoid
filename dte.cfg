# DTE configuration. One key = value per line. Every key shown with its default.
#
# summaries: print "ID title" everywhere (on) or bare IDs (off).
summaries = on
#
# protect_human: nodes made or ratified by a human need authorized_by (a human's
# name) before they can be superseded, reverted, or moved.
protect_human = on
#
# authority: advisory map of who holds each ring. "C+" means C and deeper.
# Binds agents, never humans. Unmapped rings mean "ask the human".
authority = A:human, B:orchestrator, C+:subagent
#
# decisions: the decisions dir, relative to the root. It sits beside specs/ inside tree/, which
# the author opens as one Obsidian vault. (Local patch to the vendored tool.)
decisions = tree/decisions
#
# retire: delete removes a retired node's file (needs git; the ledger
# tree/decisions/RETIRED burns the number); keep sets a status instead.
retire = delete
#
# links: how the tool writes citations and the link fields (parents, supersedes,
# superseded_by, conflicts_with). token writes dte:ID; wikilink writes [[ID]] so the
# tree is browsable from Obsidian (graph view, backlinks). Both forms are always read.  [[C81]]
links = wikilink
#
# Layers below the tree (A8 threeLayers upstream): globs that say what kind of artifact
# cites a node. show prints each as a derived list; a node never stores any of it.
# docs describe and do not count as reach.
docs = *.md, docs/*
specs = tree/specs/*, docs/socket-reference.md, tree/specs/values/value-semantics.md, tree/specs/values/format-model.md, tree/specs/canvas/layout-chrome.md, tree/specs/canvas/touch-gestures.md, docs/pack-architecture.md, docs/node-coverage.md, docs/architecture.md, docs/subsystem-invariants.md
tests = tests/*, *.test.ts, *.test.tsx, src-tauri/tests/*
agents = CLAUDE.md, .claude/*
#
# scope checks (advisory).
broad_fraction = 0.3
broad_min = 5
