# The native half of the frame-verb parity corpus: every fixture in fixtures/frame-verbs runs through
# Polars too (`corpus_cases`), so an engine change is held to the same cases the JS oracle is; the Rust
# core's own tests ([[C130]] rustCore); and the graph core's. It runs only when an engine or the corpus changes, so an ordinary
# push asks for one runner, not two.
name: Engine test

on:
  push:
    paths:
      - "src-tauri/**"
      - "crates/**"
      - "fixtures/frame-verbs/**"
      - ".github/workflows/engine-test.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "crates/**"
      - "fixtures/frame-verbs/**"
      - ".github/workflows/engine-test.yml"
  workflow_dispatch:

concurrency:
  group: engine-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Tauri's Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Engine tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/solenoid-core -> target"

      - name: Core tests
        run: cargo test --manifest-path crates/solenoid-core/Cargo.toml

  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/solenoid-graph -> target"

      - name: Graph core tests ([[D102]] graphOnCore)
        run: cargo test --manifest-path crates/solenoid-graph/Cargo.toml
