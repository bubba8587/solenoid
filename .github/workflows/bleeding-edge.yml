# [[A7]] bleedingEdgeSolenoid, [[B21]] edgeRebasesNotRebuilds
name: Bleeding edge

# Daily: rebases the persistent `bleeding-edge` branch (its dependency bumps, fixes and platform experiments) onto the
# most recently pushed work branch, bumps whatever is newer still, runs every check and replaces the report commit
# (.github/bleeding-edge/bleeding-edge.mjs). It never fails on a broken check: the report is the result.
# GitHub runs a schedule only from the default branch, so this starts once it is on main.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "Branch to build on (empty: the most recently pushed one)"
        required: false

concurrency:
  group: bleeding-edge
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bleeding-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit,cargo-audit,cargo-binstall

      - name: Install Tauri's Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Run from a copy: the script checks out the base branch, which may carry an older copy or none.
      - name: Upgrade, check, report and push
        env:
          BASE: ${{ inputs.base }}
        run: |
          cp .github/bleeding-edge/bleeding-edge.mjs "$RUNNER_TEMP/bleeding-edge.mjs"
          node "$RUNNER_TEMP/bleeding-edge.mjs" --push ${BASE:+--base "$BASE"}

      - name: Job summary
        if: always()
        run: cat .github/bleeding-edge/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
