# Test + typecheck on every push and PR. The build workflow only proves the
# Tauri binary compiles; this one keeps the 280+ unit tests and the strict
# TypeScript pass green on the server, not just on dev machines.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      # The Obsidian plugin's release workflow (bubba8587/Solenoid-Properties) builds a pinned
      # commit of this repo with this command; keep it building here first.
      - name: Build the Obsidian plugin
        run: npm run plugin:build

  # The native half of the frame-verb parity corpus: every fixture in fixtures/frame-verbs runs through
  # Polars too (`corpus_cases`), so an engine change is held to the same cases the JS oracle is.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Tauri's Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Engine tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
