# Test + typecheck on every push and PR. The build workflow only proves the
# Tauri binary compiles; this one keeps the 280+ unit tests and the strict
# TypeScript pass green on the server, not just on dev machines.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an older run's answer moot, so it stops instead of holding a runner.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsrs --noEmit

      - name: Unit tests
        run: npx vitest run

      # The headless runner bundled alone (dist-cli/), then run on a seed from an empty folder.
      - name: Build the headless CLI
        run: npm run build:cli

      # The Obsidian plugin's release workflow (bubba8587/Solenoid-Properties) builds a pinned
      # commit of this repo with this command; keep it building here first.
      - name: Build the Obsidian plugin
        run: npm run plugin:build

  # Vercel's build: a fresh install on Node 24 (npm 11 leaves optional peers out), then `npm run build`.
  vercel-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Build the site
        run: npm run build
