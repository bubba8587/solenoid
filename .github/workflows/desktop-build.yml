name: Build (desktop)

on:
  push:
    # One build per release. A merge to main builds both platforms, which also keeps the Rust and apt caches warm on
    # main, the only branch a tag's run can read caches from. A version tag (e.g. v0.1.1-alpha) is the release: it
    # publishes the files main's run built for the same commit, waiting for that run if it is still going, and builds
    # them itself only when main has no build of that commit.
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

# contents: the release job creates a Release. actions: a tag's run finds and downloads main's build.
permissions:
  contents: write
  actions: read

jobs:
  # On a tag: the run id of main's successful build of this commit, or empty when there is none.
  find-build:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          id=$(gh run list --workflow desktop-build.yml --branch main --commit "$GITHUB_SHA" --event push \
            --json databaseId,status,conclusion --jq '[.[] | select(.conclusion != "cancelled")][0].databaseId // empty')
          if [ -n "$id" ] && gh run watch "$id" --exit-status --interval 30 > /dev/null; then
            echo "Publishing main's build: run $id"
            echo "run_id=$id" >> "$GITHUB_OUTPUT"
          else
            echo "No successful build of $GITHUB_SHA on main; this run builds it."
          fi

  windows:
    needs: find-build
    if: ${{ !cancelled() && needs.find-build.outputs.run_id == '' }}
    runs-on: windows-latest
    # A cold build is about 15 minutes, a cached one 5; anything past this is a hang, not a build.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install JS dependencies
        run: npm ci

      - name: Build Tauri binary (no installer)
        run: npm run tauri build -- --no-bundle

      # Always: upload the raw build as an artifact, so any commit's binary
      # can be grabbed from the Actions tab (kept 30 days).
      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: solenoid-windows-portable-${{ github.sha }}
          path: src-tauri/target/release/solenoid.exe
          if-no-files-found: error
          retention-days: 30

  linux:
    needs: find-build
    if: ${{ !cancelled() && needs.find-build.outputs.run_id == '' }}
    # The oldest supported runner: an AppImage built against a newer glibc will
    # not start on an older distro.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # From GitHub's cache once a main run has fetched them. The compiler, curl, wget and file come with the runner
      # image. On 2026-11-11 the runner's own DNS took 20 s to fail on every Ubuntu host (azure.archive, archive,
      # security) while packages.microsoft.com resolved, making a 16-minute step twice: public resolvers answer beside
      # it (systemd-resolved takes the first reply), and apt gives up on a slow mirror sooner and retries.
      - name: Make apt resilient
        run: |
          sudo mkdir -p /etc/systemd/resolved.conf.d
          printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\n' | sudo tee /etc/systemd/resolved.conf.d/99ci-dns.conf
          sudo systemctl restart systemd-resolved
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "10";\nAcquire::https::Timeout "10";\n' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts
          time getent hosts azure.archive.ubuntu.com || echo "azure.archive.ubuntu.com still does not resolve"

      - name: Install Tauri's Linux prerequisites
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          version: "1"

      - name: Install JS dependencies
        run: npm ci

      # The AppImage is the portable file (download, mark executable, run);
      # the .deb installs it with a launcher on Debian and Ubuntu.
      - name: Build the AppImage and the .deb
        run: npm run tauri build -- --bundles appimage,deb

      - name: Upload the Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: solenoid-linux-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

  # ── Runs only on a v* tag push, with both platforms' files from main's run or this one ──────
  release:
    needs: [find-build, windows, linux]
    # The builds either ran here and passed, or were skipped because main's run had them.
    if: >-
      ${{ !cancelled() && github.ref_type == 'tag' && needs.find-build.result == 'success'
      && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download main's build
        if: needs.find-build.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          path: built
          run-id: ${{ needs.find-build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download this run's build
        if: needs.find-build.outputs.run_id == ''
        uses: actions/download-artifact@v4
        with:
          path: built

      # Versioned, user-friendly asset names (tag v0.1.1-alpha →
      # solenoid-0.1.1-alpha-windows-x64.exe).
      - name: Prepare release assets
        run: |
          v="${GITHUB_REF_NAME#v}"
          cp "$(find built -name 'solenoid.exe' | head -1)" "solenoid-$v-windows-x64.exe"
          cp "$(find built -name '*.AppImage' | head -1)" "solenoid-$v-linux-x64.AppImage"
          cp "$(find built -name '*.deb' | head -1)" "solenoid-$v-linux-amd64.deb"
          ls -l solenoid-*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            solenoid-*-windows-x64.exe
            solenoid-*-linux-x64.AppImage
            solenoid-*-linux-amd64.deb
          fail_on_unmatched_files: true
          # Tags containing a hyphen (v0.1.1-alpha, v0.2.0-beta.1) are marked
          # pre-release; a clean tag (v0.2.0) publishes as a full release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # The body starts as the auto-generated changelog (commits since the last
          # tag). The author replaces it with the release notes written from
          # docs/release-notes-features.md; a release carries notes, not install steps.
          generate_release_notes: true
