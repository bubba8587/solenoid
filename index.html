<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installed to a home screen the app opens without browser bars and, unlike the fullscreen button, keeps a sideways
         phone's page scale (tree/specs/canvas/layout-chrome.md § Installed). -->
    <!-- use-credentials: a Vercel preview sits behind its login, and Chrome fetches a manifest without cookies unless told to. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- maximum-scale=1 stops iOS from auto-zooming the page when a small node
         input gains focus; the canvas provides its own pinch-zoom, so page-level
         zoom isn't needed. viewport-fit=cover enables the safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <!-- Mobile browser chrome (Android status bar) tint. Updated to the live accent
         at runtime by appTheme.apply(); this is the pre-JS default. -->
    <meta name="theme-color" content="#56b4e9" />
    <!-- No `<meta name="color-scheme">` here: appTheme.apply() sets the authoritative
         `color-scheme` on <html> at runtime, so the meta is redundant. (A 2026-07-07
         note blamed it for killing the accent status bar — wrong: the tint "loss" was
         the PHONE's dark mode. Chrome for Android ignores theme-color on its toolbar
         whenever the browser UI is dark, meta or no meta; see appTheme.apply().) -->
    <!-- Site metadata for link previews. Static defaults for every route (the SPA has
         no per-route prerender); each page still sets its own document.title at runtime.
         The description is the canonical one-liner from DESIGN.md. -->
    <meta name="description" content="A node-graph alternative to Excel for data tables." />
    <meta property="og:title" content="Solenoid" />
    <meta property="og:description" content="A node-graph alternative to Excel for data tables." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Solenoid" />
    <meta property="og:url" content="%SITE_ORIGIN%/" />
    <link rel="canonical" href="%SITE_ORIGIN%/" />
    <meta property="og:image" content="%SITE_ORIGIN%/og-hero.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="A Solenoid graph in dark and light themes: inputs wired into formulas, a payback chart and a break-even date" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_ORIGIN%/og-hero.png" />
    <title>Solenoid · A node-graph alternative to Excel</title>
    <!-- Structured data: tells search engines this is a free app, not an article. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Solenoid",
        "description": "A node-graph alternative to Excel for data tables.",
        "url": "%SITE_ORIGIN%/",
        "image": "%SITE_ORIGIN%/og-hero.png",
        "screenshot": "%SITE_ORIGIN%/og-hero.png",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, Windows, Linux",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "license": "https://github.com/bubba8587/solenoid/blob/main/LICENSE"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
