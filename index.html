<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- maximum-scale=1 stops iOS from auto-zooming the page when a small node
         input gains focus; the canvas provides its own pinch-zoom, so page-level
         zoom isn't needed. viewport-fit=cover enables the safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <!-- Mobile browser chrome (Android status bar) tint. Updated to the live accent
         at runtime by appTheme.apply(); this is the pre-JS default. -->
    <meta name="theme-color" content="#56b4e9" />
    <!-- NB: do NOT add `<meta name="color-scheme" content="light dark">` here. It
         makes Chrome Android theme its OWN toolbar per the page's color-scheme and
         IGNORE `theme-color`, so the accent status-bar tint above vanishes in dark
         mode. appTheme.apply() sets the authoritative `color-scheme` on <html> at
         runtime (form controls / scrollbars still theme correctly) WITHOUT that
         side effect. (Removed 2026-07-07 — it had silently killed the accent bar.) -->
    <title>Solenoid</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
