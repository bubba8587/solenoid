<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- maximum-scale=1 stops iOS from auto-zooming the page when a small node
         input gains focus; the canvas provides its own pinch-zoom, so page-level
         zoom isn't needed. viewport-fit=cover enables the safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <!-- Mobile browser chrome (Android status bar) tint. Updated to the live accent
         at runtime by appTheme.apply(); this is the pre-JS default. -->
    <meta name="theme-color" content="#56b4e9" />
    <!-- No `<meta name="color-scheme">` here: appTheme.apply() sets the authoritative
         `color-scheme` on <html> at runtime, so the meta is redundant. (A 2026-07-07
         note blamed it for killing the accent status bar — wrong: the tint "loss" was
         the PHONE's dark mode. Chrome for Android ignores theme-color on its toolbar
         whenever the browser UI is dark, meta or no meta; see appTheme.apply().) -->
    <!-- Site metadata for link previews. Static defaults for every route (the SPA has
         no per-route prerender); each page still sets its own document.title at runtime.
         The description is the canonical one-liner from DESIGN.md. -->
    <meta name="description" content="A node-graph alternative to Excel for data tables." />
    <meta property="og:title" content="Solenoid" />
    <meta property="og:description" content="A node-graph alternative to Excel for data tables." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://solenoid-ngc.vercel.app" />
    <meta property="og:image" content="https://solenoid-ngc.vercel.app/og-hero.png" />
    <meta property="og:image:width" content="2560" />
    <meta property="og:image:height" content="1392" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://solenoid-ngc.vercel.app/og-hero.png" />
    <title>Solenoid</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
